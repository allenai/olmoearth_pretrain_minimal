[project]
name = "olmoearth-pretrain-minimal"
version = "0.0.2"
description = "Minimal package for loading and initializing OlmoEarth models"
authors = [
    { name = "OlmoEarth Team" },
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11, <3.14"
dependencies = [
    "einops>=0.7.0",
    "huggingface_hub",
    "numpy>=1.26.4",
    "universal-pathlib>=0.2.5",
]

[project.optional-dependencies]
torch-cpu = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<1",
]
torch-cu128 = [
    "pytorch-triton",
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<1",
]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olmoearth_pretrain_minimal*"]

[tool.setuptools.package-data]
"olmoearth_pretrain_minimal.olmoearth_pretrain_v1.data.norm_configs" = ["*.json"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu128", extra = "torch-cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu128", extra = "torch-cu128" },
]
pytorch-triton = [
    { index = "pytorch-cu128", extra = "torch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]

