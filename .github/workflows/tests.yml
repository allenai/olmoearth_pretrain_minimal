name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test with torch-cpu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.5"

    - name: Install dependencies
      run: |
        # Install with CPU-only torch (suitable for CI)
        uv sync --python 3.12 --extra torch-cpu --extra dev
        source .venv/bin/activate
        # Install the project itself
        uv pip install -e .

    - name: Run tests (without weights)
      run: |
        source .venv/bin/activate
        pytest -v tests/ -m "not slow"

    - name: Run tests (with weights - slow)
      run: |
        source .venv/bin/activate
        pytest -v tests/ -m slow

